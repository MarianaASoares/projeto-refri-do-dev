<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="Imagens fundo/ícone.png" type="image/png">
    <title>Refrigerante Dev</title>
</head>
<body>
    <main>
        <div class="item active" style="--background:#EA3D41">
            <div class="titulo">Strawberry</div>
            <img class="fruta" src="Imagens fundo/Morango-refrigerante-foregroundBlur.png" alt="Imagem fruta morango">
            <img class="refrigerante" src="Imagens fundo/Morango-refrigerante.png" alt="Refrigerante de morango">
        </div>

        <div class="item" style="--background:#2D5643">
            <div class="titulo">Avocado</div>
            <img class="fruta" src="Imagens fundo/Abacate-refrigerante-foregroundBlur.png" alt="Imagem fruta abacate">
            <img class="refrigerante" src="Imagens fundo/Abacate-refrigerante.png" alt="Refrigerante de abacate">
        </div>

        <div class="item" style="--background:#E7A043">
            <div class="titulo">Orange</div>
            <img class="fruta" src="Imagens fundo/Laranja-refrigerante-foregroundBlur.png" alt="Imagem fruta laranja">
            <img class="refrigerante" src="Imagens fundo/Laranja-refrigerante.png" alt="Refrigerante de laranja">
        </div>

        <div class="seta_página">
            <button id="prev"> < </button>
            <button id="next"> > </button>
        </div>
    </main>

</body>
<script src="script.js"></script>
</html>
